name: Deploy Worker

on:
  push:
    branches:
      - main

concurrency:
  group: production-main-deploy
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verification browser
        run: npx playwright install --with-deps chromium

      # OPS installs the three STATS Actions secrets separately. No secret-only deploy.
      # All identity/settings/real-data gates pass before migration or bootstrap writes.
      - name: Preflight, bootstrap, deploy with runtime secrets, and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          STATS_CF_API_TOKEN: ${{ secrets.STATS_CF_API_TOKEN }}
          STATS_CF_ACCOUNT_ID: ${{ secrets.STATS_CF_ACCOUNT_ID }}
          STATS_CF_ZONE_ID: ${{ secrets.STATS_CF_ZONE_ID }}
        run: node scripts/deploy-stats.mjs

      - name: Remove ephemeral deployment files even after failure
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP"/stats-deploy-*
