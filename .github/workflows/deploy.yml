name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate deploy secrets
        run: |
          test -n "$CLOUDFLARE_D1_DATABASE_ID"

      - name: Inject Cloudflare D1 database ID
        run: |
          perl -0pi -e 's/00000000-0000-0000-0000-000000000000/$ENV{CLOUDFLARE_D1_DATABASE_ID}/g' wrangler.jsonc

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
