    <radialGradient id="glow-left" cx="0.18" cy="0.14" r="0.72">
      <stop offset="0%" stop-color="#00e6bf" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#00e6bf" stop-opacity="0" />
